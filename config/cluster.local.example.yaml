# Example: copy to config/cluster.local.yaml (not tracked) and fill in your own values; they override the same keys in config/cluster.yaml.
# Then run python -m scripts.make_cluster_jobs; the real job scripts are generated into cluster/local/ (not tracked),
# and scripts/push_to_cluster.sh pushes them to the cluster/ directory on the cluster.
cluster:
  cid: your-cid                          # Cluster login user name
paths:
  code_dir: /path/on/cluster/openvas             # Code directory (target of push_to_cluster.sh)
  venv_dir: /path/on/cluster/openvas/.venv       # By convention <code_dir>/.venv
  data_dir: /path/on/cluster/hai-21.03           # HAI data directory -> HAI_DATA_DIR
  artifact_dir: /path/on/cluster/openvas_artifacts  # Artifact root directory -> ARTIFACT_DIR
