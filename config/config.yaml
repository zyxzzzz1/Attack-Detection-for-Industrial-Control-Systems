# Project configuration: extension part (gvm, vuln, intel, fusion, report) and main line (ml).

gvm:
  # Host path of the gvmd socket (Docker Compose deployment, socket volume bind-mounted to /tmp/gvm/gvmd)
  socket_path: /tmp/gvm/gvmd/gvmd.sock
  # Lab subnet: only hosts inside this subnet may be scanned (constraint 8)
  lab_subnet: 192.168.56.0/24

vuln:
  # XML reports exported from OpenVAS (input of parse_report, one per target, parsed together)
  # smoke_report.xml = ews_01 (Metasploitable2); after E3 scans hmi_main, append data/samples/hmi_main_report.xml
  report_xmls:
    - data/samples/smoke_report.xml
  # Normalized vulnerability records (output of parse_report, M7 data contract)
  vulns_json: data/processed/vulns.json
  # Vulnerability records after threat-intel enrichment (output of intel; does not overwrite vulns_json)
  vulns_enriched_json: data/processed/vulns_enriched.json

intel:
  # Official CISA KEV JSON feed
  kev_url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
  kev_cache: data/intel/kev.json
  kev_max_age_hours: 24
  # FIRST EPSS API: the cve parameter is limited to 2000 characters (including commas); limit defaults to 100
  epss_url: https://api.first.org/data/v1/epss
  epss_cache: data/intel/epss.csv
  epss_max_param_chars: 2000
  epss_batch_size: 100
  # CVEs without an EPSS record are left empty in the cache and re-queried after this many days
  epss_missing_max_age_days: 7
  # Network requests: per-request timeout (s), number of retries, exponential backoff base (s)
  timeout_s: 30
  retries: 3
  backoff_s: 2

fusion:
  # Asset mapping (constructed by hand) and fusion scoring parameters
  asset_map: config/asset_map.yaml
  params: config/fusion.yaml
  # Actual HAI 21.03 column names (sensor names of the mock alerts are validated against this)
  hai_columns_txt: data/samples/hai_columns.txt
  # Alert input (from I1 on): real alerts by default, i.e. all alarm segments of the full LSTM-AE run on the cluster
  # (exported by python -m scripts.export_alerts, is_mock: false, tracked)
  alerts_json: data/processed/alerts.json
  # Mock alerts (each with is_mock: true, tracked): used with --mock in the pipeline or when switched in the Streamlit sidebar
  mock_alerts_json: data/mock/alerts.json
  # Fusion scoring output (large, regenerable with one command, not tracked); mock output is stored separately so neither overwrites the other
  enriched_alerts_json: data/processed/enriched_alerts.json
  mock_enriched_alerts_json: data/processed/enriched_alerts_mock.json
  # Alert cards (M10): Jinja2 template directory and output directory (regenerable, not tracked)
  templates_dir: templates
  cards_dir: reports/cards
  mock_cards_dir: reports/cards_mock
  # Generate cards only for the top N alerts by priority and list only those in the index page and Streamlit (there are over a thousand real alerts);
  # enriched_alerts.json still contains all alerts. 0 or null means no limit
  max_rendered_alerts: 50

report:
  # E6 report material (based on real data, tracked)
  extension_dir: reports/extension

ml:
  # Main-line (M0 -> R1) parameters. The data and artifact directories can be overridden by the environment variables HAI_DATA_DIR and ARTIFACT_DIR (one codebase for local and cluster)
  seed: 42
  # HAI raw data directory (train1.csv.gz etc. directly inside, not tracked)
  data_dir: data/raw/hai-21.03
  # Root of intermediate artifacts (artifacts/{model}/, not tracked)
  artifact_dir: artifacts
  # Main-line report directory (tracked)
  report_dir: reports/main
  hai:
    version: "21.03"
    train_files: [train1.csv.gz, train2.csv.gz, train3.csv.gz]
    # test files are read only in the final evaluation (constraint 2); the M0 data statistics are descriptive only and not used for tuning
    test_files: [test1.csv.gz, test2.csv.gz, test3.csv.gz, test4.csv.gz, test5.csv.gz]
    time_col: time
    label_cols: [attack, attack_P1, attack_P2, attack_P3]
    # Official repository: the contents API returns each file's size and git blob sha, used to verify downloads
    api_url: https://api.github.com/repos/icsdataset/hai/contents/hai-21.03
    raw_url: https://raw.githubusercontent.com/icsdataset/hai/master/hai-21.03
    # Download verification results (expected size, sha, verification time), written into the data directory
    manifest: download_manifest.json
    # Column-name reference (generated from train1 by scripts.inspect_hai_columns)
    columns_txt: data/samples/hai_columns.txt
  data:
    # After concatenating in time order, the last val_fraction is the validation set; it is split again by val_es_fraction into val_es (early stopping) | val_thr (threshold)
    val_fraction: 0.2
    val_es_fraction: 0.5
    # Rows of the official train files whose content is identical to test files (see section 3 of reports/main/data_summary.md); removed from the training set when the switch is on.
    # Described here by row counts only, so the training pipeline never reads test files; tests/test_preprocess.py checks via content hashes that no test rows remain after removal.
    drop_train_overlap: true
    train_overlap_drops:
      - {file: train1.csv.gz, head_rows: 1, tail_rows: 43201}
  window:
    length: 60
    train_stride: 10
    eval_stride: 1
  # Training defaults (main-line decision 4). Identical on CPU and GPU, never changed per device; not used by PCA / IsolationForest
  train:
    optimizer: adam
    lr: 0.001
    batch_size: 256
    max_epochs: 50
    patience: 5          # Early stopping: stop when the val_es loss has not decreased for this many consecutive epochs
    eval_batch_size: 1024  # Windows per batch during validation / scoring (affects only speed and memory, not results)
  threshold:
    # Threshold = this quantile of the val_thr scores (constraint 3). sensitivity_quantiles is only for sensitivity analysis, never for choosing the threshold
    quantile: 0.99
    sensitivity_quantiles: [0.99, 0.995, 0.999]
  eval:
    # Merge gap of alarm segments (s): 0 = merge only consecutive alarms. Shared by evaluate and export_alerts (main-line decision 6)
    merge_gap_s: 0
  diagnosis:
    # Heavy-tail feature diagnosis (val_thr only): average share of each sensor in the reconstruction MSE. When a single sensor exceeds max_sensor_share,
    # the run stops before reading test so a human can decide whether to change the scaling; only after that decision is allow_over_limit set to true
    # The decision depends only on the baseline named by model; other reconstruction models also write share tables but never stop the run
    model: pca
    max_sensor_share: 0.30
    allow_over_limit: false
  attribution:
    # Attribution (M5): Top-k sensors per alarm segment; the three reconstruction models being compared
    top_k: [3, 5]
    models: [lstm_ae, lstm_vae, pca]
    # Boundaries (s) of the alarm-segment duration groups for hit rates: < first value, between the two (inclusive), > second value
    duration_bins_s: [10, 60]
    # Exploratory analysis (post hoc, does not replace the main results): divide in-segment errors by each sensor's mean error on val_thr before ranking Top-k
    exploratory_val_norm: true
  alerts:
    # alerts.json (I1): exported only from the LSTM-AE artifacts, each alert with its Top-k sensors
    model: lstm_ae
    top_k: 5
    output: data/processed/alerts.json
  fusion_eval:
    # Fusion ranking evaluation (I1, src/eval/fusion_ranking.py): the k values of precision@k
    ks: [10, 20, 50]
  collapse:
    # Collapse check (M2c, mainly for Deep SVDD): warn when the coefficient of variation (std / |mean|) of the val_thr scores is below this value
    min_score_cv: 0.001
  # The five models (values of --model in run_model); per-model hyperparameters are added under their own keys in the corresponding stages (M2a-M2c)
  models:
    # PCA: input is the per-second vector (reasoning in src/models/classic.py), keeping 95% of the variance
    pca: {input: per_second, variance: 0.95}
    # IsolationForest: input is mean, std, min, max, last-first of each sensor per window;
    # empty max_train_windows means all training windows (about 70k at stride=10); feature_batch is the number of windows per feature batch
    iforest: {n_estimators: 100, max_samples: 256, max_train_windows: null, feature_batch: 4096}
    # LSTM-AE (main model): W=60, hidden=64 fixed in advance (constraint 9); ablation results must not be used to change this
    lstm_ae: {hidden: 64, layers: 1}
    # LSTM-VAE: loss = reconstruction + beta*KL (both summed per window, see src/models/lstm_vae.py)
    lstm_vae: {hidden: 64, layers: 1, latent: 32, beta: 1.0}
    # Deep SVDD: bias-free LSTM encoder; components of the center c with absolute value below eps are set to +/-eps
    deep_svdd: {hidden: 64, layers: 1, rep_dim: 32, eps: 0.1}
  runtime:
    # DataLoader workers; the actual value never exceeds the CPUs requested by the job (SLURM_CPUS_PER_TASK)
    num_workers: 0
  smoke:
    # Smoke test (--smoke): take only the first fraction of rows of each file, train 1 epoch. Numbers are only for checking the pipeline, never for the report
    fraction: 0.01
    max_epochs: 1
    # Smoke artifacts go to <artifact dir>/artifact_subdir/; when developing report scripts on smoke artifacts, output goes to <artifact dir>/report_subdir/
    artifact_subdir: smoke
    report_subdir: smoke_reports
    # Extra clips taken from test (by row number, 0-based): the first event of test1 (rows 2111~2302, see reports/main/attack_events.csv)
    # plus 600 s before and after, so the event-level metrics are really exercised in the smoke run too
    extra_test_clips:
      - {file: test1.csv.gz, start_row: 1511, rows: 1392}
  seed_study:
    # Multiple random seeds (decided 2026-10-09): only for LSTM-AE in the main-model configuration, to estimate the random variation of F1 and AUROC; other models stay single-seed.
    # The seed equal to ml.seed is the main-model run itself (directory lstm_ae/); runs for the other seeds live in <run_subdir>/<model>_s<seed>/,
    # submitted with a single override ml.seed=<seed>. Alert export, attribution and figures still use only the main-model run.
    model: lstm_ae
    seeds: [42, 43, 44, 45, 46]
    run_subdir: seeds
    seed_key: ml.seed
  ablation:
    # LSTM-AE ablation grid (M4): job array task indices follow row-major order over windows x hiddens (0 = first W, first hidden)
    model: lstm_ae
    windows: [30, 60, 120]
    hiddens: [32, 64, 128]
    window_key: ml.window.length
    hidden_key: ml.models.lstm_ae.hidden
