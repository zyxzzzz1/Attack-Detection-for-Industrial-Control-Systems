# Fusion scoring parameters (claude.md section 7, M9).

# Per-vulnerability risk r_v = min(1, (cvss/10) x (1 + beta*epss) x (gamma if in_kev else 1))
beta: 1.0
gamma: 1.5

# Alert priority = S x sum_sub w_sub*(1 + alpha*E_sub)*criticality_sub
alpha: 1.0

# Minimum quality of detection (QoD, 0~100): vulnerabilities below this value are excluded from the risk computation.
# parse_report does not filter by QoD; vulns.json keeps all results with their qod field.
# Vulnerabilities below this value that are in KEV are listed separately under needs_review (the alert card shows "needs manual verification").
min_qod: 70

# Maximum number of path-asset vulnerabilities attached to each alert (sorted by r_v, descending)
max_vulns_per_alert: 10
