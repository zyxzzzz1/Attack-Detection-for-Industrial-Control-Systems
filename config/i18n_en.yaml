'P4 为 HIL 仿真子系统,无独立控制链;它与 P1、P2、P3 都有物理耦合(P3 的泵和阀由 HIL 中的抽水蓄能发电模型控制),其异常可能由 P1/P2/P3 的攻击经物理耦合传导而来,建议同时排查 P1/P2/P3 相关资产。': 'P4 is the HIL simulation subsystem and has no control chain of its own. It is physically coupled with P1, P2 and P3 (the pump and valve of P3 are controlled by the pumped-storage hydropower generation model in the HIL); its anomalies may be caused by attacks on P1/P2/P3 propagating through physical coupling, so the assets related to P1/P2/P3 should be investigated as well.'
