'- 误报的卡片与真实攻击的卡片在形式上完全一样（同样的入侵路径、漏洞和修复建议）。卡片不能帮助判断一条报警是不是误报，它只是在报警为真的前提下给出排查的起点。': '- The card of the false alarm looks exactly like the cards of the real attacks (the same intrusion paths, vulnerabilities and remediation advice). A card does not help decide whether an alert is a false alarm; it only gives a starting point for investigation on the assumption that the alert is real.'
资产映射是人为构造的，漏洞数据来自自建靶机的扫描，与 HAI 中的攻击没有因果关系；卡片中的入侵路径和漏洞只说明原型如何把信息组织到一起，不是对这些攻击的溯源结论。: The asset mapping is constructed by hand and the vulnerability data comes from scanning a self-built target machine; neither has any causal relation to the attacks in HAI. The intrusion paths and vulnerabilities on the cards only show how the prototype brings the information together; they are not a conclusion about where these attacks came from.
'- 案例 2 的 Top-1 落在 P4（HIL 仿真部分，没有子系统标签，按规则必然算未命中）。P4 与 P1、P2、P3 都有物理耦合，指向 P4 不一定是错的，现有标签无法判断；卡片对 P4 附有说明，建议同时排查 P1 / P2 / P3。': '- In Case 2 the Top-1 sensor falls in P4 (the HIL simulation part, which has no subsystem label, so by the rule it always counts as a miss). P4 is physically coupled with P1, P2 and P3, so pointing to P4 is not necessarily wrong; the available labels cannot tell. The card carries a note on P4 and recommends investigating P1 / P2 / P3 as well.'
'**对照标签**：这条报警与攻击事件 #{eid} 重叠（{start} ~ {end}，{d} 秒，标签中的受攻击子系统 {subs}；该事件的检测延迟 {delay} 秒）。Top-1 传感器 {sensor} 属于 {sub}，': '**Against the labels**: this alert overlaps attack event #{eid} ({start} ~ {end}, {d} s, attacked subsystem according to the labels {subs}; detection delay of this event {delay} s). The Top-1 sensor {sensor} belongs to {sub}, '
? '- 三张卡片列出的漏洞都来自同一台已扫描的资产（{asset}），排在最前的也是同一条：只有一台靶机被评估，凡是涉及 P1 或 P2 的报警都会得到几乎相同的漏洞上下文，真实攻击和误报之间没有区别。这是单靶机和风险饱和造成的局限（见 PROGRESS.md 的 M9 一节）。'
: '- The vulnerabilities listed on all three cards come from the same scanned asset ({asset}), and the top entry is the same one: only a single target machine has been assessed, so every alert that involves P1 or P2 receives almost the same vulnerability context, with no difference between real attacks and false alarms. This is a limitation caused by the single target machine and by risk saturation (see the M9 section of PROGRESS.md).'
? '- 案例 3 的误报（分数是阈值的 {f} 倍）排在案例 2 的真实攻击（{r} 倍）之前。原因是异常严重度 S = min(1, 分数 ÷ 阈值 − 1) 在分数达到阈值的 2 倍时就封顶为 1，两条报警的 S 相同，排序只由子系统的权重、关键度和 E_sub 决定。S 的封顶点太低，是这套打分公式的一个缺陷。'
: '- The false alarm of Case 3 (score {f} times the threshold) is ranked ahead of the real attack of Case 2 ({r} times). The reason is that the anomaly severity S = min(1, score ÷ threshold − 1) is capped at 1 as soon as the score reaches 2 times the threshold, so both alerts have the same S and the ranking is decided only by subsystem weights, criticality and E_sub. The cap on S is too low; this is a flaw of the scoring formula.'
? '- 案例 2 的 Top-1 传感器不在受攻击的子系统内，但 Top-5 里其余传感器大多属于受攻击的子系统：卡片按 Top-5 的误差占比加权后，仍把 {share} 的权重放在 {subs} 上，给出的入侵路径也是它的。也就是说"Top-1 是否命中"比卡片实际展示的信息更严格；这只是这一条报警的情况，不能推广。'
: '- In Case 2 the Top-1 sensor is not in the attacked subsystem, but most of the other Top-5 sensors are: after weighting by the Top-5 error shares the card still puts {share} of the weight on {subs}, and the intrusion paths it gives belong to that subsystem. In other words, "whether Top-1 is a hit" is stricter than the information the card actually shows; this holds for this one alert only and must not be generalised.'
? 报警来自 LSTM-AE 主模型运行（{model}，种子 {seed}）在 HAI 21.03 测试集上的全部 {n} 条报警段。案例按固定规则挑选，不人工挑选：按融合优先级的排名从前往后，分别取第一条归因正确的真实攻击、第一条归因错误的真实攻击、第一条误报。"是否真实攻击、归因是否命中"来自事后用标签做的评估，卡片上没有这些信息。
: 'The alerts are all {n} alarm segments of the LSTM-AE main model run ({model}, seed {seed}) on the HAI 21.03 test set. The cases are selected by a fixed rule, not by hand: going down the fusion priority ranking, take the first real attack with correct attribution, the first real attack with wrong attribution, and the first false alarm. "Whether it is a real attack and whether the attribution is a hit" comes from an evaluation done afterwards with the labels; the cards do not contain this information.'
