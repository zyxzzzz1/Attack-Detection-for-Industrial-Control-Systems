# Cluster configuration: Minerva (Chalmers CSE). Notes in docs/cluster_notes.md, procedure in docs/cluster_runbook.md.
# Unknown items are written as TODO (look them up after logging in, per step 1 of the runbook).
# Personal information (login user name, absolute paths on the cluster) does not go here: it lives in the untracked config/cluster.local.yaml
# (example in config/cluster.local.example.yaml), which overrides the same keys of this file when generating job scripts.
# After changes run `python -m scripts.make_cluster_jobs`: it generates the tracked job scripts under cluster/ from this file (paths are TODO, usable only for local --smoke),
# and, if cluster.local.yaml exists, also the real job scripts under cluster/local/ from the merged config (untracked, pushed to the cluster by push_to_cluster.sh).

cluster:
  name: minerva
  scheduler: slurm
  # ssh alias, configured in the local ~/.ssh/config (HostName minerva.cse.chalmers.se, User is the CID)
  ssh_alias: minerva
  login_host: minerva.cse.chalmers.se
  # Reachable only from the Chalmers network or VPN
  network: Chalmers network or VPN
  cid: TODO set in config/cluster.local.yaml    # Chalmers CID (login user name)
  os: Ubuntu 24.04
  python: python3              # System python3 is 3.12

paths:
  # Absolute paths on the cluster: real values go in config/cluster.local.yaml (actual layout: three sibling directories under home: code, data, artifacts)
  code_dir: TODO set in config/cluster.local.yaml      # Code directory (target of push_to_cluster.sh)
  venv_dir: TODO set in config/cluster.local.yaml      # Virtualenv directory, by convention <code_dir>/.venv
  data_dir: TODO set in config/cluster.local.yaml      # HAI data directory (train1.csv.gz etc. directly inside) -> HAI_DATA_DIR
  artifact_dir: TODO set in config/cluster.local.yaml  # Artifact root directory -> ARTIFACT_DIR; slurm logs go to its slurm_logs/

partitions:
  default:
    name: short                # Default partition name
    max_time: "00:30:00"       # Default partition time limit (short)
  long:
    name: long
    max_time: "1-00:00:00"     # At most 1 day

gpus:
  # This project always requests a single L4; no multi-GPU code
  L4: {memory_gb: 24, count: 32}
  L40s: {memory_gb: 48, count: 8}

storage:
  home_quota: no per-user quota (quota prints nothing); home is /data/users/<CID>, /data is shared by everyone at 59T, 2.8T free on 2026-10-08 (96% used)  # home quota
  scratch: no separate scratch (no /scratch or /local, TMPDIR not set); data and artifacts all go under /data/users/<CID>  # Whether scratch exists, its path and purge policy

network:
  compute_nodes_internet: true # Whether compute nodes have internet access (decides whether data verification uses --offline)
  cuda_driver: driver 595.71.05 (read from /proc/driver/nvidia/version on 2026-10-08; CUDA 13.0 requires driver 580 or later, satisfied, so the default torch wheel from PyPI is used)  # CUDA version supported by the driver (decides the CUDA build of torch, see env/README.md)

code_transfer: rsync           # Confirmed (2026-10-07): scripts/push_to_cluster.sh, pushes only git-tracked files

jobs:
  # pytest via srun (the first job on the cluster): default partition, no -p
  pytest: {cpus_per_task: 4, mem: 8G, time: "00:20:00"}
  # LSTM models (lstm_ae, lstm_vae, deep_svdd)
  train:
    partition: long
    gres: gpu:L4:1
    cpus_per_task: 4
    mem: 32G
    time: "00:10:00"           # Full LSTM-AE run measured at 80 s (job 274401, 50 epochs, 2026-10-08); x1.5 is 2 minutes, rounded up to 10 minutes
  # PCA and IsolationForest: no GPU requested
  baselines:
    partition: long
    cpus_per_task: 16
    mem: 64G
    time: "00:05:00"           # Measured 58 s (job 274399, 2026-10-08); x1.5 is about 1.5 minutes, rounded up to 5 minutes
  # LSTM-AE ablation: job array, same resources as train
  ablation:
    partition: long
    gres: gpu:L4:1
    cpus_per_task: 4
    mem: 32G
    time: "00:10:00"           # Time limit per array task. Longest measured 4 min 45 s (task 8, W=120, hidden=128, job 274568, 2026-10-09); x1.5 is about 7 minutes, rounded up to 10 minutes
    array_concurrency: 3       # Number of array tasks running concurrently (the %3 in --array=0-8%3)
